<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狭間書房 | 社員マイページ</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    body {
      background-color: #111;
      color: #f5f5f5;
      font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
      line-height: 1.8;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1em 2em;
      background-color: #666;
      color: #fff;
      flex-shrink: 0;
      gap: 2em;
      box-sizing: border-box;
      width: 100%;
    }
    .title-wrapper {
      display: flex;
      flex-direction: column;
    }
    .title-wrapper a {
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .title-wrapper a:hover h1 {
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }
    header h1 {
      margin: 0;
      font-size: 3em;
      letter-spacing: 0.1em;
      line-height: 1;
      border: none;
      font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
      font-weight: 700;
    }
    .subtitle {
      margin: 0;
      padding: 0;
      line-height: 1;
      font-size: 1em;
      text-align: center;
      color: #fff;
    }

    /* 検索 */
    .search {
      display: flex;
      align-items: center;
      gap: 0.5em;
      flex-shrink: 0;
      margin-left: auto;
    }
    .search form {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }
    .search input {
      padding: 4px;
      border: 2px solid #333;
      border-radius: 4px;
      width: 150px;
      background-color: #fff;
      color: #333;
    }
    .search input::placeholder {
      color: #333aa;
    }
    .search button {
      padding: 4px 6px;
      border-radius: 4px;
      border: none;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .search button:hover {
      background-color: #222;
    }

    /* ナビゲーション */
    nav {
      text-align: center;
      padding: 1em 0;
      background-color: #f0f0f0;
      flex-shrink: 0;
      overflow-x: auto;
      box-sizing: border-box;
      width: 100%;
    }
    nav a {
      color: #003366;
      margin: 0 1em;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      white-space: nowrap;
    }
    nav a:hover {
      color: #666;
    }
    nav a.active {
      color: #666;
      border-bottom: 2px solid #666;
    }

    /* メインコンテンツエリア */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2em 1em;
      box-sizing: border-box;
      width: 100%;
    }

    .container {
      background-color: #1a1a1a;
      padding: 2em 3em;
      border: 1px solid #444;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      max-width: 500px;
      width: 100%;
      position: relative;
      box-sizing: border-box;
    }

    .container h1 {
      text-align: center;
      font-size: 1.8em;
      margin-bottom: 1.5em;
      letter-spacing: 0.2em;
      color: #fff;
    }

    label {
      display: block;
      margin-bottom: 0.5em;
      font-size: 0.9em;
      color: #ccc;
    }

    .container input {
      width: 100%;
      padding: 0.6em;
      margin-bottom: 1.2em;
      background-color: #000;
      border: 1px solid #666;
      color: #fff;
      font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
      box-sizing: border-box;
    }

    .container input:focus {
      outline: none;
      border-color: #aaa;
    }

    .container button[type="submit"] {
      width: 100%;
      padding: 0.8em;
      background-color: #000;
      border: 1px solid #888;
      color: #f5f5f5;
      cursor: pointer;
      font-size: 1em;
      font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
      transition: all 0.3s ease;
    }
    .container button[type="submit"]:hover {
      background-color: #111;
      border-color: #fff;
    }

    .note {
      margin-top: 1em;
      font-size: 0.8em;
      color: #777;
      text-align: center;
    }
    .error {
      color: #ff6666;
      text-align: center;
      margin-bottom: 1em;
      font-size: 0.9em;
    }
    .profile {
      line-height: 1.8;
    }
    .profile h2 {
      text-align: center;
      margin-bottom: 1em;
      font-size: 1.5em;
    }
    .profile p {
      margin: 0.8em 0;
      word-wrap: break-word;
    }
    .profile a {
      color: #8ab4f8;
      text-decoration: none;
    }
    .profile a:hover {
      text-decoration: underline;
    }
    .logout-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #f5f5f5;
      font-size: 1.5em;
      cursor: pointer;
      transition: color 0.3s;
      width: auto;
      padding: 0;
    }
    .logout-btn:hover {
      color: #ff6666;
    }

    /* フッター */
    footer {
      background-color: #666;
      color: #ffffff;
      text-align: center;
      padding: 1em;
      flex-shrink: 0;
      margin-top: auto;
      box-sizing: border-box;
      width: 100%;
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      header {
        padding: 1em;
        justify-content: center;
        text-align: center;
        flex-wrap: wrap;
        gap: 1em;
      }

      header h1 {
        font-size: 2em;
      }

      .title-wrapper {
        width: 100%;
      }

      .search {
        width: 100%;
      }

      .search form {
        width: 100%;
        display: flex;
      }

      .search input {
        width: 100%;
        flex: 1;
      }

      nav a {
        margin: 0 0.5em;
        font-size: 0.9em;
      }

      .main-content {
        padding: 1.5em 1em;
      }

      .container {
        padding: 1.5em 2em;
        max-width: 100%;
      }

      .container h1 {
        font-size: 1.5em;
        margin-bottom: 1.2em;
      }

      .profile h2 {
        font-size: 1.3em;
      }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        gap: 0.5em;
      }

      header h1 {
        font-size: 1.5em;
      }

      .subtitle {
        font-size: 0.9em;
      }

      .search {
        width: 100%;
      }

      .search input {
        width: 100%;
        padding: 0.5em;
      }

      .search button {
        padding: 0.5em 0.8em;
        font-size: 0.9em;
      }

      nav a {
        margin: 0 0.3em;
        font-size: 0.8em;
      }

      .main-content {
        padding: 1em 0.8em;
      }

      .container {
        padding: 1.2em 1.5em;
      }

      .container h1 {
        font-size: 1.3em;
        margin-bottom: 1em;
        letter-spacing: 0.1em;
      }

      label {
        font-size: 0.85em;
      }

      .container input {
        padding: 0.5em;
        margin-bottom: 1em;
        font-size: 0.9em;
      }

      .container button[type="submit"] {
        padding: 0.7em;
        font-size: 0.95em;
      }

      .note {
        font-size: 0.75em;
      }

      .profile h2 {
        font-size: 1.2em;
        margin-bottom: 0.8em;
      }

      .profile p {
        font-size: 0.9em;
        margin: 0.6em 0;
      }

      .logout-btn {
        top: 10px;
        right: 10px;
        font-size: 1.3em;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-wrapper">
      <a href="https://hazamashobo.github.io/main/index.html">
        <h1>狭間書房</h1>
        <p class="subtitle">Hazama Publishing</p>
      </a>
    </div>
    <div class="search">
      <form action="https://hazamashobo.github.io/result/" method="get">
        <input type="text" id="searchInput" name="q" placeholder="キーワード入力">
        <button type="submit">検索</button>
      </form>
    </div>
  </header>

  <nav>
    <a href="https://hazamashobo.github.io/main/index.html">ホーム</a>
    <a href="https://hazamashobo.github.io/company/index.html">狭間書房について</a>
    <a href="https://hazamashobo.github.io/books/index.html">刊行物</a>
    <a href="https://hazamashobo.github.io/contact/index.html" class="active">お問い合わせ</a>
  </nav>

  <div class="main-content">
    <div class="container" id="login-container">
      <h1>狭間書房 社員マイページ</h1>
      <form id="loginForm">
        <div class="error" id="error"></div>
        <label for="code">社員番号</label>
        <input type="text" id="code" name="code" placeholder="例: HS0001" required>
        <label for="dob">パスワード（半角小文字英数字）</label>
        <input type="text" id="dob" name="dob" required>
        <button type="submit">ログイン</button>
      </form>
      <p class="note">※ 本ページは狭間書房社員専用です。</p>
    </div>

    <div class="container" id="mypage-container" style="display:none;">
      <button id="logoutBtn" class="logout-btn">×</button>
      <div class="profile">
        <h2 id="empName"></h2>
        <p><strong>社員コード：</strong> <span id="empCode"></span></p>
        <p><strong>部署：</strong> <span id="empDept"></span></p>
        <p><strong>役職：</strong> <span id="empRole"></span></p>
        <p><strong>入社年：</strong> <span id="empYear"></span></p>
        <p><strong>備考：</strong> <span id="empNote"></span></p>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 狭間書房</p>
  </footer>

<script>
    // 社員名簿データ（13人分）
    const employees = [
      { code: "HS0001", dob: "19651225", name: "桐須 瑛人", dept: "編集部", role: "編集長", year: "2000.4.1", note: "パスワードが更新されています<br>hint：my favorite song" },
      { code: "HS0001", dob: "santamaria", name: "桐須 瑛人", dept: "編集部", role: "編集長", year: "2000.4.1", note: '<a href="https://hazamashobo.github.io/kiroku/index.html">2025.09.05の日記</a>'},
      { code: "HS0002", dob: "19700503", name: "薮 翔子", dept: "編集部", role: "副編集長", year: "2002.4.1", note: "更新はありません" },
      { code: "HS0003", dob: "19791130", name: "鳥羽 舞", dept: "編集部", role: "", year: "2006.4.1", note: "更新はありません" },
      { code: "HS0004", dob: "19850629", name: "立城 純平", dept: "編集部", role: "", year: "2008.4.1", note:'<a href="https://hazamashobo.github.io/mendan/index.html">面談資料</a>' },
      { code: "HS0005", dob: "19900921", name: "佐久間 大晴", dept: "編集部", role: "", year: "2018.4.1", note: "更新はありません" },
      { code: "HS0006", dob: "19920824", name: "安藤 玲香", dept: "編集部", role: "", year: "2018.4.1", note: "更新はありません" },
      { code: "HS0007", dob: "19920725", name: "大渕 航也", dept: "編集部", role: "1on1担当", year: "2019.4.1", note: "更新はありません" },
      { code: "HS0008", dob: "19950703", name: "外山 昴", dept: "編集部", role: "", year: "2020.4.1", note: "更新はありません" },
      { code: "HS0009", dob: "19980503", name: "福井 里帆", dept: "編集部", role: "情報システム担当", year: "2021.4.1", note: "更新はありません" },
      { code: "HS0010", dob: "19981028", name: "湯田 伊織", dept: "編集部", role: "", year: "2022.4.1", note: '<a href="https://hazamashobo.github.io/plan/index.html">記録</a>'},
      { code: "HS0011", dob: "eagle", name: "赤羽 義人", dept: "編集部", role: "", year: "2023.4.1", note: '<a href="https://hazamashobo.github.io/irregular/index.html">『LIMINAL SPACE 100』イレギュラー対応</a>'},
      { code: "HS0011", dob: "20001227", name: "赤羽義人", dept: "編集部", role: "", year: "2023.4.1", note: "パスワードが更新されています" },
      { code: "HS0012", dob: "20011028", name: "下野 凛", dept: "編集部", role: "", year: "2024.4.1", note: "更新はありません" },
      { code: "HS0013", dob: "20020619", name: "堀北 大樹", dept: "編集部", role: "", year: "2025.4.1", note: "更新はありません" },
    ];

    const loginForm = document.getElementById("loginForm");
    const errorDiv = document.getElementById("error");
    const loginContainer = document.getElementById("login-container");
    const mypageContainer = document.getElementById("mypage-container");
    const logoutBtn = document.getElementById("logoutBtn");

    logoutBtn.addEventListener("click", () => {
      mypageContainer.style.display = "none";
      loginContainer.style.display = "block";
      errorDiv.textContent = "";
      loginForm.reset();
    });

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const code = document.getElementById("code").value.trim();
      const dob = document.getElementById("dob").value;

      const employee = employees.find(emp => emp.code === code && emp.dob === dob);

      if (employee) {
        document.getElementById("empName").textContent = employee.name;
        document.getElementById("empCode").textContent = employee.code;
        document.getElementById("empDept").textContent = employee.dept;
        document.getElementById("empRole").textContent = employee.role || "—";
        document.getElementById("empYear").textContent = employee.year;
        document.getElementById("empNote").innerHTML = employee.note || "—";

        loginContainer.style.display = "none";
        mypageContainer.style.display = "block";
      } else {
        errorDiv.textContent = "社員コードまたは生年月日が正しくありません。";
      }
    });
  </script>
</body>
</html>
